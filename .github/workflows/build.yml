name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exe:
    name: ${{ matrix.asset }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            asset: zhange-app-x64.exe
          - target: i686-pc-windows-msvc
            asset: zhange-app-x86.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build single executable
        run: npm run tauri build -- --no-bundle --target ${{ matrix.target }}

      - name: Collect executable
        shell: pwsh
        run: |
          $src = "src-tauri/target/${{ matrix.target }}/release/zhange-app.exe"
          if (-not (Test-Path $src)) { throw "找不到 $src" }
          New-Item -ItemType Directory -Force dist-exe | Out-Null
          Copy-Item $src "dist-exe/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist-exe/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: zhange-app-*
          merge-multiple: true
          path: dist-exe

      - name: Resolve tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            version=$(node -p "require('./src-tauri/tauri.conf.json').version")
            echo "name=v${version}" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: dist-exe/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
