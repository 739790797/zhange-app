[package]
name = "zhange-app"
version = "0.2.0"
description = "战鸽助手"
edition = "2021"

[lib]
name = "zhange_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
dirs = "6"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "cookies"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tauri = { version = "2", features = ["image-png"] }
webview2-com = "0.38"
windows-core = "0.61"
tokio = { version = "1", features = ["macros", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
